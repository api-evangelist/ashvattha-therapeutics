aid: ashvattha-therapeutics
name: Ashvattha Therapeutics
description: 'Ashvattha Therapeutics is a clinical-stage biopharmaceutical company developing
  a new class of precision nanomedicines built on hydroxyl dendrimer therapeutics (HDTs),
  a platform exclusively licensed from Johns Hopkins University. Hydroxyl dendrimers
  traverse tissue barriers such as the blood-retinal and blood-brain barrier and are
  selectively taken up by activated cells in regions of inflammation, allowing known
  small-molecule drugs to be delivered intracellularly to diseased tissue with sustained
  effect and reduced off-target exposure. The company is advancing programs across
  ophthalmology, neurology, and inflammatory disease, led by migaldendranib (MGB),
  a first-in-class subcutaneously administered nanomedicine in Phase 2 development
  for diabetic macular edema and neovascular age-related macular degeneration, plus
  hydroxyl dendrimer PET imaging tracers such as [18F]OP-801. Founded by Jeffrey L.
  Cleland, Kannan Rangaramanujam, and Sujatha Kannan. Ashvattha publishes no public
  developer program, API, or machine-readable interface.'
